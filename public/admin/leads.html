<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Leads — AusHomeValue Admin</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7f6; color: #17211d; padding: 24px; }
h1 { font-size: 1.3rem; margin-bottom: 16px; color: #0d6b57; }
p.count { font-size: 0.85rem; color: #66736d; margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
th { text-align: left; padding: 10px 14px; font-size: 0.75rem; font-weight: 600; color: #66736d; text-transform: uppercase; letter-spacing: 0.5px; background: #f0f7f4; border-bottom: 1px solid #dbe2de; }
td { padding: 10px 14px; font-size: 0.85rem; border-bottom: 1px solid #eef2f0; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #f8fbfa; }
.time { color: #889994; font-size: 0.78rem; white-space: nowrap; }
.refresh { display: inline-block; margin-bottom: 12px; padding: 8px 16px; background: #0d6b57; color: white; border: none; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
.refresh:hover { background: #0a5948; }
.loading { color: #889994; font-size: 0.85rem; }
.error { color: #dc2626; font-size: 0.85rem; }
</style>
</head>
<body>
<h1>📋 Lead Contacts</h1>
<button class="refresh" onclick="loadLeads()">⟳ Refresh</button>
<p class="count" id="count"></p>
<div id="loading" class="loading">Loading...</div>
<table id="table" style="display:none;">
<thead><tr><th>#</th><th>Email</th><th>Name</th><th>Phone</th><th>Registered</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
<div id="error" class="error" style="display:none;"></div>
<script>
function loadLeads() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('table').style.display = 'none';
  document.getElementById('error').style.display = 'none';
  fetch('/api/leads')
    .then(r => r.json())
    .then(data => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('table').style.display = 'table';
      document.getElementById('count').textContent = 'Total: ' + data.total + ' leads';
      var tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      data.leads.forEach(function(l) {
        var tr = document.createElement('tr');
        var time = new Date(l.registeredAt).toLocaleString('en-AU', { timeZone: 'Australia/Melbourne' });
        tr.innerHTML = '<td>' + l.id + '</td><td>' + esc(l.email) + '</td><td>' + esc(l.name || '—') + '</td><td>' + esc(l.phone || '—') + '</td><td class="time">' + time + '</td>';
        tbody.appendChild(tr);
      });
    })
    .catch(function(err) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').textContent = 'Failed to load: ' + err.message;
    });
}
function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
loadLeads();
</script>
</body>
</html>
