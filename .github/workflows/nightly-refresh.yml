name: Weekly Suburb Metrics Refresh

on:
  schedule:
    # Monday 02:30 AEST / 03:30 AEDT, before Investor Watch at 04:15/05:15.
    - cron: '30 16 * * 0'
  workflow_dispatch:  # allow manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Run weekly suburb metrics refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node lib/refresh-suburb-metrics.js
