name: Published Site Statistics Audit

on:
  schedule:
    # After weekly suburb refresh and Investor Watch monitoring.
    - cron: '0 19 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compare published claims with Production database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/update-site-stats.mjs --check
